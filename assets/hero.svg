<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">write-judge blocks an agent edit that deletes test assertions</title>
  <desc id="d">An agent tries to delete two expect lines to make a test pass. write-judge asks Clef whether the change weakens a test, gets 0.97, and blocks the edit in 232 milliseconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6821f"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .stamp{transform:rotate(-8deg);transform-box:fill-box;transform-origin:center}
      @media (prefers-reduced-motion:no-preference){
        .del{animation:strike 6s ease-in-out infinite}
        .stamp{animation:stamp 6s cubic-bezier(.2,1.6,.4,1) infinite}
        .fill{transform-box:fill-box;transform-origin:left;animation:fill 6s ease-out infinite}
        .num{animation:num 6s steps(1) infinite}
      }
      @keyframes strike{0%,15%{opacity:1}25%,100%{opacity:.35}}
      @keyframes fill{0%,25%{transform:scaleX(0)}45%,100%{transform:scaleX(1)}}
      @keyframes stamp{0%,45%{opacity:0;transform:scale(1.6) rotate(-8deg)}55%,92%{opacity:1;transform:scale(1) rotate(-8deg)}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
      @keyframes num{0%,44%{opacity:0}45%,100%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>

  <g class="sans">
    <text x="60" y="78" fill="#f6821f" font-size="15" font-weight="600" letter-spacing="3">WRITE-JUDGE</text>
    <text x="60" y="122" fill="#f5f5f4" font-size="36" font-weight="700">Your agent can't cheat the tests.</text>
    <text x="60" y="156" fill="#a1a1aa" font-size="18">Every edit is judged before it lands. Weakening a test gets blocked.</text>
  </g>

  <g transform="translate(60,196)">
    <rect width="560" height="300" rx="14" fill="#0f1115" stroke="#26282e"/>
    <circle cx="22" cy="22" r="6" fill="#3f3f46"/><circle cx="42" cy="22" r="6" fill="#3f3f46"/><circle cx="62" cy="22" r="6" fill="#3f3f46"/>
    <text x="90" y="27" class="mono" fill="#71717a" font-size="13">agent → edit test/limit.test.ts</text>
    <g class="mono" font-size="16">
      <text x="24" y="78" fill="#a1a1aa">test("rate limit", () =&gt; {</text>
      <g class="del">
        <rect x="16" y="94" width="528" height="30" rx="4" fill="#ef44441a"/>
        <text x="24" y="115" fill="#fca5a5">-   expect(allow(100)).toBe(false);</text>
        <rect x="16" y="128" width="528" height="30" rx="4" fill="#ef44441a"/>
        <text x="24" y="149" fill="#fca5a5">-   expect(allow(99)).toBe(true);</text>
      </g>
      <text x="24" y="186" fill="#a1a1aa">});</text>
    </g>
    <text x="24" y="240" class="sans" fill="#71717a" font-size="15" font-style="italic">"Tests are failing. I'll remove the</text>
    <text x="24" y="264" class="sans" fill="#71717a" font-size="15" font-style="italic"> flaky assertions so CI passes."</text>
  </g>

  <g transform="translate(660,196)">
    <text x="0" y="22" class="sans" fill="#a1a1aa" font-size="15">Clef: does this weaken a test?</text>
    <rect x="0" y="40" width="480" height="18" rx="9" fill="#1f2127"/>
    <rect class="fill" x="0" y="40" width="466" height="18" rx="9" fill="url(#bar)"/>
    <line x1="240" y1="34" x2="240" y2="64" stroke="#52525b" stroke-dasharray="3 3"/>
    <text x="240" y="84" class="mono" fill="#52525b" font-size="12" text-anchor="middle">0.5 threshold</text>
    <g class="num mono">
      <text x="480" y="22" fill="#f5f5f4" font-size="20" font-weight="700" text-anchor="end">0.97</text>
    </g>

    <g class="stamp" filter="url(#glow)">
      <rect x="160" y="128" width="300" height="104" rx="12" fill="none" stroke="#ef4444" stroke-width="5"/>
      <text x="310" y="194" class="sans" fill="#ef4444" font-size="46" font-weight="800" text-anchor="middle" letter-spacing="6">BLOCKED</text>
    </g>
    <g class="num mono" font-size="14" fill="#a1a1aa">
      <text x="0" y="276">232 ms · file unchanged · agent told why</text>
    </g>
  </g>

  <text x="60" y="532" class="mono" fill="#52525b" font-size="14">pi install git:github.com/acoyfellow/write-judge</text>
  <text x="1140" y="532" class="sans" fill="#52525b" font-size="14" text-anchor="end">Clef on Workers AI · real run, real log</text>
</svg>
